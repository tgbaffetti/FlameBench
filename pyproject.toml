[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-flamebench"
version = "0.1.0"
description = "Reproducible forced reacting-flow forecasting benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "tensorboard>=2.16,<3", "wandb>=0.18,<1", "optuna>=4,<6", "python-dotenv>=1,<2", "pyvista>=0.46,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "pre-commit>=3.5,<5"]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
flamebench = "Experiments.run:main"

[tool.setuptools.packages.find]
include = ["DataProcessing*", "Baselines*", "Experiments*"]

[tool.setuptools]
py-modules = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
